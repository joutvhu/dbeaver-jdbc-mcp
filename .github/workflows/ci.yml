name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java 17 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Node CLI syntax
        run: node -c bin/index.js

      - name: Grant execute permission for mvnw
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Run Maven Tests
        run: ./mvnw test
        shell: bash

      - name: Build Fat JAR
        run: ./mvnw package -DskipTests
        shell: bash
