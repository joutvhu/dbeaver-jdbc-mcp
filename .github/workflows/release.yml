name: Release & Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Package & Publish (Release Assets, NPM, Maven Central)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Determine Version
        id: get_version
        run: |
          # Extract version from tag (e.g. v1.0.0 -> 1.0.0 or 1.0.0 -> 1.0.0)
          RAW_TAG="${{ github.event.release.tag_name }}"
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION} from tag: ${RAW_TAG}"

      - name: Update versions in pom.xml and package.json
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Update Maven version using wrapper
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          # Update NPM package.json version in root
          npm version ${VERSION} --no-git-tag-version

      - name: Build Fat JAR with Maven Wrapper
        run: |
          ./mvnw clean package -DskipTests
          # Copy shaded jar to root folder for npm packaging
          cp target/dbeaver-mcp.jar dbeaver-mcp.jar
          chmod +x bin/index.js

      - name: Create Portable Zip for GitHub Release
        run: |
          mkdir -p dist
          cp target/dbeaver-mcp.jar dist/
          cp dbeaver-mcp.cmd dist/
          cp dbeaver-mcp.sh dist/
          chmod +x dist/dbeaver-mcp.sh
          cd dist
          zip -r ../dbeaver-mcp-${{ steps.get_version.outputs.VERSION }}-portable.zip .
          cd ..

      # -------------------------------------------------------------
      # 1. Upload Assets to the Created GitHub Release
      # -------------------------------------------------------------
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dbeaver-mcp.jar
            dbeaver-mcp-${{ steps.get_version.outputs.VERSION }}-portable.zip
            dbeaver-mcp.cmd
            dbeaver-mcp.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 2. Publish to NPM Registry (npx dbeaver-mcp) from Root
      # -------------------------------------------------------------
      - name: Publish to NPM
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -------------------------------------------------------------
      # 3. Publish to Maven Central (Optional if secrets are set)
      # -------------------------------------------------------------
      - name: Publish to Maven Central
        if: ${{ secrets.OSSRH_USERNAME != '' }}
        run: ./mvnw clean deploy -P release -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
